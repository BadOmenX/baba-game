<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巴巴博弈 - 在线博弈论对战平台</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="bg-gradient"></div>
    <header>
        <div class="logo" onclick="switchPage('home')">🎮 巴巴博弈</div>
        <nav>
            <button class="nav-btn active" data-page="home">首页</button>
            <button class="nav-btn" data-page="problems">题库</button>
            <button class="nav-btn" data-page="battle">对战</button>
        </nav>
    </header>

    <main>
        <section id="home" class="page active">
            <div class="hero">
                <h1>🕹️ 巴巴博弈</h1>
                <p class="subtitle">棋盘博弈 · Nim变体 · 树上博弈 · 在线实时对战</p>
                <p class="hero-desc">精选洛谷/CF经典博弈论题目，图形化交互体验</p>
                <div class="hero-buttons">
                    <button class="btn-primary btn-lg pulse" onclick="switchPage('battle')">⚔️ 开始对战</button>
                    <button class="btn-secondary btn-lg" onclick="switchPage('problems')">📚 浏览题库</button>
                </div>
                <div class="hero-stats">
                    <div class="stat"><span class="stat-num">9+</span><span class="stat-label">博弈类型</span></div>
                    <div class="stat"><span class="stat-num">2</span><span class="stat-label">难度等级</span></div>
                    <div class="stat"><span class="stat-num">∞</span><span class="stat-label">策略空间</span></div>
                </div>
            </div>
        </section>

        <section id="problems" class="page">
            <h2>📚 博弈论题库</h2>
            <p style="color:#94a3b8;margin-bottom:8px;">点击卡片查看原题，进入对战自动随机生成局面</p>
            <div class="problem-grid" id="problem-grid"></div>
        </section>

        <section id="battle" class="page">
            <h2>⚔️ 对战房间</h2>
            <div id="room-lobby">
                <div class="setup-step" id="step-rule">
                    <h3>🎯 选择博弈规则</h3>
                    <div class="rule-cards" id="rule-cards"></div>
                </div>
                <div class="setup-step hidden" id="step-config">
                    <h3>⚙️ 对战设置</h3>
                    <div class="mode-select">
                        <button class="mode-btn active" data-mode="single" onclick="selectMode('single')">🤖 单人模式</button>
                        <button class="mode-btn" data-mode="multi" onclick="selectMode('multi')">👥 双人对战</button>
                    </div>
                    <div id="single-config">
                        <div class="config-row">
                            <label>AI 难度：</label>
                            <div class="difficulty-select">
                                <button class="diff-btn active" data-diff="normal" onclick="selectDifficulty('normal')">😊 普通</button>
                                <button class="diff-btn" data-diff="hard" onclick="selectDifficulty('hard')">🧠 困难</button>
                            </div>
                        </div>
                        <div class="config-row" id="custom-config-row">
                            <label id="config-label">自定义配置：</label>
                            <div class="stone-config">
                                <input type="text" id="custom-stones" placeholder="留空则随机">
                                <button class="btn-secondary btn-sm" onclick="randomStones()">🎲 随机</button>
                            </div>
                        </div>
                    </div>
                    <div id="multi-config" class="hidden">
                        <div class="room-actions">
                            <button class="btn-primary" onclick="createRoom()">🏠 创建房间</button>
                            <span class="or-divider">或</span>
                            <div class="join-area">
                                <input type="text" id="room-code-input" placeholder="输入6位房间号" maxlength="6">
                                <button class="btn-secondary" onclick="joinRoom()">🚪 加入房间</button>
                            </div>
                        </div>
                    </div>
                    <button class="btn-primary btn-lg" onclick="startGame()" style="margin-top:20px;">🚀 开始游戏</button>
                </div>
            </div>

            <div id="game-room" style="display:none;">
                <div class="game-top-bar">
                    <div class="player-panel" id="panel-p1">
                        <div class="player-avatar">🔴</div>
                        <div class="player-name" id="name-p1">玩家1</div>
                        <div class="player-timer" id="timer-p1">30</div>
                    </div>
                    <div class="game-info">
                        <div class="room-badge"><span id="room-badge">---</span></div>
                        <div class="turn-indicator" id="turn-indicator">等待开始...</div>
                        <button class="btn-surrender" onclick="surrender()">🏳️ 认输</button>
                    </div>
                    <div class="player-panel" id="panel-p2">
                        <div class="player-avatar">🔵</div>
                        <div class="player-name" id="name-p2">玩家2</div>
                        <div class="player-timer" id="timer-p2">30</div>
                    </div>
                </div>
                <div class="rule-hint" id="rule-hint"></div>
                <div class="game-board" id="game-board"></div>
                <div class="game-controls" id="game-controls"></div>
                <div class="game-log">
                    <h4>📜 对战记录</h4>
                    <div id="log-list"></div>
                </div>
            </div>
        </section>
    </main>

    <footer><p>🐛 巴巴博弈 · BadOmenX · 2026</p></footer>

    <script src="js/config.js"></script>
    <script src="js/problems.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
